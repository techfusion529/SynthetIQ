name: Build & Push Docker Images to Google Artifact Registry

on:
  push:
    branches: [main, dev]
    paths:
      - "packages/**"
      - "api/**"
      - "worker/**"
      - "mcp/**"
      - "simulator/**"
      - "mocks/**"
      - "dashboard/**"
      - "data/**"
  workflow_dispatch:

env:
  REGISTRY: asia-south1-docker.pkg.dev
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'synthetiq-dev' }}
  REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'synthetiq-docker-repo' }}
  IMAGE_PREFIX: asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || 'synthetiq-dev' }}/${{ vars.ARTIFACT_REPOSITORY || 'synthetiq-docker-repo' }}

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      mcp: ${{ steps.filter.outputs.mcp }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      simulator: ${{ steps.filter.outputs.simulator }}
      mocks: ${{ steps.filter.outputs.mocks }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'packages/synthetiq-shared/**'
            worker:
              - 'worker/**'
              - 'packages/synthetiq-shared/**'
              - 'data/**'
            mcp:
              - 'mcp/**'
              - 'packages/synthetiq-shared/**'
            dashboard:
              - 'dashboard/**'
            simulator:
              - 'simulator/**'
              - 'packages/synthetiq-shared/**'
              - 'data/**'
            mocks:
              - 'mocks/**'
              - 'packages/synthetiq-shared/**'

  build-api:
    name: Build & Push API Image
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GKE_SA_KEY }}
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/api:latest

  build-worker:
    name: Build & Push Worker Image
    needs: detect-changes
    if: needs.detect-changes.outputs.worker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GKE_SA_KEY }}
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/worker:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/worker:latest

  build-mcp:
    name: Build & Push MCP Image
    needs: detect-changes
    if: needs.detect-changes.outputs.mcp == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GKE_SA_KEY }}
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: mcp/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/mcp:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/mcp:latest

  build-dashboard:
    name: Build & Push Dashboard Image
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GKE_SA_KEY }}
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/dashboard:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/dashboard:latest

  build-simulator:
    name: Build & Push Simulator Image
    needs: detect-changes
    if: needs.detect-changes.outputs.simulator == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GKE_SA_KEY }}
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: simulator/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/simulator:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/simulator:latest

  build-mocks:
    name: Build & Push Mocks Image
    needs: detect-changes
    if: needs.detect-changes.outputs.mocks == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GKE_SA_KEY }}
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: mocks/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/mocks:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/mocks:latest
