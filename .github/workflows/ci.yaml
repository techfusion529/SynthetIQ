name: CI — Lint & Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  python-checks:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install workspace
        run: uv sync --all-packages

      - name: Lint with Ruff
        run: uv run ruff check packages/ api/ worker/ mcp/ simulator/ mocks/

      - name: Type check with Mypy
        run: uv run mypy packages/shared/src/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests (all services)
        run: |
          uv run pytest packages/shared/tests/ -v --tb=short
          uv run pytest api/tests/ -v --tb=short
          uv run pytest worker/tests/ -v --tb=short
          uv run pytest mcp/tests/ -v --tb=short
          uv run pytest simulator/tests/ -v --tb=short
          uv run pytest mocks/tests/ -v --tb=short

  dashboard-checks:
    name: Next.js Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  helm-checks:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Lint Helm chart
        run: helm lint deploy/helm/synthetiq/

      - name: Template validation (dry-run)
        run: helm template synthetiq-test deploy/helm/synthetiq/ > /dev/null
