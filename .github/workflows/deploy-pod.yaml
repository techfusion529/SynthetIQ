name: Deploy Single Pod

on:
  workflow_dispatch:
    inputs:
      pod:
        description: "Pod to deploy"
        required: true
        type: choice
        options:
          - dashboard
          - api
          - worker
          - mcp
          - simulator
          - grafana
          - temporal-ui
      image_tag:
        description: "Image tag (defaults to latest)"
        required: false
        default: "latest"

env:
  HELM_CHART_PATH: deploy/helm/synthetiq

jobs:
  deploy-pod:
    name: Deploy ${{ github.event.inputs.pod }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Authenticate to GKE
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_CLUSTER_ZONE }}

      - name: Deploy single pod via Helm
        run: |
          # Disable all pods, then enable only the target
          helm upgrade --install synthetiq-${{ github.event.inputs.pod }} ${{ env.HELM_CHART_PATH }} \
            -f ${{ env.HELM_CHART_PATH }}/values-prod.yaml \
            --set global.imageTag=${{ github.event.inputs.image_tag }} \
            --set dashboard.enabled=false \
            --set api.enabled=false \
            --set worker.enabled=false \
            --set mcp.enabled=false \
            --set simulator.enabled=false \
            --set ollama.enabled=false \
            --set temporalServer.enabled=false \
            --set temporalUi.enabled=false \
            --set grafana.enabled=false \
            --set prometheus.enabled=false \
            --set ingress.enabled=false \
            --set ${{ github.event.inputs.pod }}.enabled=true \
            --atomic \
            --timeout 5m \
            --namespace synthetiq

      - name: Verify pod
        run: |
          kubectl get pods -n synthetiq -l app.kubernetes.io/component=${{ github.event.inputs.pod }}
