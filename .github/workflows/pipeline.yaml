name: SynthetIQ CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip Kubernetes deployment"
        type: boolean
        default: false

env:
  REGISTRY: asia-south1-docker.pkg.dev
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'synthetiq-dev' }}
  REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'synthetiq-docker-repo' }}
  GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME || 'synthetiq-cluster' }}
  GKE_LOCATION: ${{ vars.GKE_CLUSTER_ZONE || 'asia-south1-a' }}
  HELM_CHART_PATH: deploy/helm/synthetiq

jobs:
  # ========================================================
  # STAGE 1: LINT & TEST
  # ========================================================
  python-lint-test:
    name: "Stage 1: Python Lint & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.13

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Lint with Ruff
        run: uv run ruff check packages/ api/ worker/ mcp/ simulator/ mocks/ || true

  dashboard-build:
    name: "Stage 1: Dashboard Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  helm-lint:
    name: "Stage 1: Helm Chart Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Lint Helm chart
        run: helm lint deploy/helm/synthetiq/

      - name: Template validation (dry run)
        run: helm template synthetiq-test deploy/helm/synthetiq/ > /dev/null

  # ========================================================
  # STAGE 2: BUILD & PUSH TO ARTIFACT REGISTRY
  # ========================================================
  build-and-push:
    name: "Stage 2: Build & Push (${{ matrix.service }})"
    needs: [python-lint-test, dashboard-build, helm-lint]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.GKE_SA_KEY }}
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, mcp, dashboard, simulator, mocks]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check GCP Credentials Secret
        if: ${{ env.GCP_SA_KEY == '' }}
        run: |
          echo "::error title=Missing Secret::GCP_SA_KEY secret is not set in GitHub repository secrets! Go to Settings -> Secrets and variables -> Actions to add it."
          exit 1

      - name: Authenticate to Google Cloud
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'dashboard' && './dashboard' || '.' }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:latest

  # ========================================================
  # STAGE 3: DEPLOY OVER KUBERNETES (GKE)
  # ========================================================
  deploy-base-infra:
    name: "Stage 3: Deploy Base Infrastructure & Secrets"
    needs: [build-and-push]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !inputs.skip_deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.GKE_SA_KEY }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Check GCP Credentials Secret
        if: ${{ env.GCP_SA_KEY == '' }}
        run: |
          echo "::error title=Missing Secret::GCP_SA_KEY secret is not set in GitHub repository secrets! Go to Settings -> Secrets and variables -> Actions to add it."
          exit 1

      - name: Authenticate to Google Cloud
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_LOCATION }}

      - name: Prepare Cluster for Helm Adoption
        run: |
          echo "Cleaning unmanaged out-of-band resources so Helm can cleanly adopt and manage them..."
          kubectl delete configmap temporal-dynamic-config -n synthetiq --ignore-not-found
          kubectl delete ingress synthetiq-ingress -n synthetiq --ignore-not-found

      - name: Configure Ingress TLS Secret
        if: ${{ secrets.SSL_CERTIFICATE != '' && secrets.SSL_PRIVATE_KEY != '' }}
        run: |
          echo "Applying TLS certificate secret for synthetiq.ddns.net..."
          cat << 'EOF' > /tmp/tls.crt
          ${{ secrets.SSL_CERTIFICATE }}
          EOF
          cat << 'EOF' > /tmp/tls.key
          ${{ secrets.SSL_PRIVATE_KEY }}
          EOF
          kubectl create secret tls synthetiq-tls-cert \
            --cert=/tmp/tls.crt \
            --key=/tmp/tls.key \
            -n synthetiq --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/tls.crt /tmp/tls.key

      - name: Apply Helm Release & Cluster Resources
        run: |
          helm upgrade --install synthetiq ${{ env.HELM_CHART_PATH }} \
            -f ${{ env.HELM_CHART_PATH }}/values-prod.yaml \
            --set global.environment="${{ vars.APP_ENV || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}" \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }} \
            --set global.imageTag=${{ github.sha }} \
            --set secrets.geminiApiKey="${{ secrets.GEMINI_API_KEY }}" \
            --set secrets.databaseUrl="${{ secrets.DATABASE_URL }}" \
            --set secrets.jwtSecret="${{ secrets.JWT_SECRET }}" \
            --set config.gcpProjectId="${{ vars.GCP_PROJECT_ID || 'synthetiq-dev' }}" \
            --set config.gcpRegion="${{ vars.GCP_REGION || 'asia-south1' }}" \
            --set config.geminiModel="${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}" \
            --set config.bigqueryDatasetId="${{ vars.BIGQUERY_DATASET_ID || 'epr_compliance' }}" \
            --set config.pubsubScadaTopic="${{ vars.PUBSUB_SCADA_TOPIC || 'scada-telemetry-stream' }}" \
            --set config.jevMode="${{ vars.JEV_MODE || 'NIMBLE_PRIMARY' }}" \
            --namespace synthetiq \
            --create-namespace \
            --wait=false

      - name: Verify Cluster Resources Applied
        run: |
          kubectl get all -n synthetiq

  deploy-service:
    name: "Stage 3: Deploy (${{ matrix.name }})"
    needs: [deploy-base-infra]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.GKE_SA_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "PostgreSQL Database"
            deployment: "synthetiq-postgres"
            component: "postgres"
          - name: "Redis Cache"
            deployment: "synthetiq-redis"
            component: "redis"
          - name: "Temporal Server"
            deployment: "temporal-server"
            component: "temporal-server"
          - name: "Temporal Web UI"
            deployment: "temporal-ui"
            component: "temporal-ui"
          - name: "FastAPI Gateway"
            deployment: "synthetiq-api"
            component: "api"
          - name: "AI Temporal Worker"
            deployment: "synthetiq-worker"
            component: "worker"
          - name: "Next.js Dashboard"
            deployment: "synthetiq-dashboard"
            component: "dashboard"
          - name: "MCP Tool Gateway"
            deployment: "synthetiq-mcp"
            component: "mcp"
          - name: "SCADA Simulator"
            deployment: "synthetiq-simulator"
            component: "simulator"
          - name: "Prometheus Monitoring"
            deployment: "prometheus"
            component: "prometheus"
          - name: "Grafana Dashboards"
            deployment: "grafana"
            component: "grafana"
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_LOCATION }}

      - name: Track Deployment Rollout Status
        run: |
          echo "Monitoring rollout status for deployment ${{ matrix.deployment }}..."
          kubectl rollout status deployment/${{ matrix.deployment }} -n synthetiq --timeout=180s || true

      - name: Display Pod Details & Status
        run: |
          echo "=== Pods for ${{ matrix.name }} (${{ matrix.component }}) ==="
          kubectl get pods -n synthetiq -l app.kubernetes.io/component=${{ matrix.component }} -o wide
          echo "=== Recent Events ==="
          kubectl get events -n synthetiq --field-selector involvedObject.name=${{ matrix.deployment }} --sort-by='.metadata.creationTimestamp' | tail -n 20 || true

      - name: Print Pod Logs
        if: always()
        run: |
          echo "=== Container Logs (last 50 lines) ==="
          kubectl logs -n synthetiq -l app.kubernetes.io/component=${{ matrix.component }} --tail=50 || true
