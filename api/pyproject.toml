[project]
name = "synthetiq-api"
version = "0.1.0"
description = "SynthetIQ API Gateway — FastAPI endpoints for dashboard, workflows, and approvals"
requires-python = ">=3.13"
dependencies = [
    "synthetiq-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.10",
    "python-dotenv>=1.0.0",
    "firebase-admin>=6.5.0",
    "temporalio>=1.7.0",
    "redis>=5.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.9",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "google-genai>=1.0.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-auth>=2.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
