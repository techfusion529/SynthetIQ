[project]
name = "synthetiq-api"
version = "0.1.0"
description = "SynthetIQ API Gateway — FastAPI endpoints for dashboard, workflows, and approvals"
requires-python = ">=3.11"
dependencies = [
    "synthetiq-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "firebase-admin>=6.5.0",
    "temporalio>=1.7.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
