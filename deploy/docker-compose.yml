# ============================================================
# SynthetIQ — Local Development Stack
# Usage: docker compose -f deploy/docker-compose.yml up -d
# ============================================================

services:
  # --- Temporal Server (with auto-setup) ---
  temporal-server:
    image: temporalio/auto-setup:latest
    container_name: synthetiq-temporal
    ports:
      # SECURITY: Temporal has no auth. Never expose ports 7233/8080 externally.
      # Workers connect via internal Docker network; loopback is for local CLI only.
      - "127.0.0.1:7233:7233"
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal-server:7233", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- Temporal Web UI ---
  temporal-ui:
    image: temporalio/ui:latest
    container_name: synthetiq-temporal-ui
    depends_on:
      temporal-server:
        condition: service_healthy
    ports:
      # SECURITY: Temporal UI is admin-only. Loopback binding prevents public exposure.
      - "127.0.0.1:8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233

  # --- Ollama (Gemma 2B for PII Scrubbing) ---
  ollama:
    image: ollama/ollama:latest
    container_name: synthetiq-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- OpenTelemetry Collector ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: synthetiq-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Collector internal metrics
      - "8889:8889"   # Prometheus metrics exporter

  # --- Prometheus ---
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: synthetiq-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"

  # --- Grafana ---
  grafana:
    image: grafana/grafana:10.4.0
    container_name: synthetiq-grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/synthetiq-overview.json
    volumes:
      - ./helm/synthetiq/dashboards:/etc/grafana/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

  # --- Google Cloud Pub/Sub Emulator ---
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: synthetiq-pubsub
    ports:
      - "8085:8085"
    command: >
      gcloud beta emulators pubsub start
      --host-port=0.0.0.0:8085
      --project=synthetiq-local

volumes:
  ollama-data:
  grafana-provisioning-ds:
  grafana-provisioning-dash:
