{{- if and .Values.ingress.enabled (dig "docs" "enabled" true .Values.ingress) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synthetiq-ingress-docs
  labels:
    {{- include "synthetiq.labels" . | nindent 4 }}
    app.kubernetes.io/component: docs
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- if and .Values.ingress.docs .Values.ingress.docs.annotations }}
    {{- toYaml .Values.ingress.docs.annotations | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.domain }}
    - host: {{ .Values.ingress.domain | quote }}
      http:
        paths:
          - path: {{ dig "docs" "path" "/docs" .Values.ingress }}
            pathType: Prefix
            backend:
              service:
                name: synthetiq-docs
                port:
                  number: {{ .Values.docs.port | default 80 }}
    {{- end }}
    - http:
        paths:
          - path: {{ dig "docs" "path" "/docs" .Values.ingress }}
            pathType: Prefix
            backend:
              service:
                name: synthetiq-docs
                port:
                  number: {{ .Values.docs.port | default 80 }}
{{- end }}
