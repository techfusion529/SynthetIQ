{{- if and .Values.ingress.enabled (dig "grafana" "enabled" true .Values.ingress) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synthetiq-ingress-grafana
  labels:
    {{- include "synthetiq.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- if and .Values.ingress.grafana .Values.ingress.grafana.annotations }}
    {{- toYaml .Values.ingress.grafana.annotations | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.domain }}
    - host: {{ .Values.ingress.domain | quote }}
      http:
        paths:
          - path: {{ dig "grafana" "path" "/grafana" .Values.ingress }}
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: {{ .Values.grafana.port | default 3000 }}
    {{- end }}
    - http:
        paths:
          - path: {{ dig "grafana" "path" "/grafana" .Values.ingress }}
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: {{ .Values.grafana.port | default 3000 }}
{{- end }}
