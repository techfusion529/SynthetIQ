{{- if and .Values.ingress.enabled (dig "temporal" "enabled" true .Values.ingress) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synthetiq-ingress-temporal
  labels:
    {{- include "synthetiq.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-ui
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- if and .Values.ingress.temporal .Values.ingress.temporal.annotations }}
    {{- toYaml .Values.ingress.temporal.annotations | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.domain }}
    - host: {{ .Values.ingress.domain | quote }}
      http:
        paths:
          - path: {{ dig "temporal" "path" "/temporal" .Values.ingress }}
            pathType: Prefix
            backend:
              service:
                name: temporal-ui
                port:
                  number: {{ .Values.temporalUi.port | default 8080 }}
    {{- end }}
    - http:
        paths:
          - path: {{ dig "temporal" "path" "/temporal" .Values.ingress }}
            pathType: Prefix
            backend:
              service:
                name: temporal-ui
                port:
                  number: {{ .Values.temporalUi.port | default 8080 }}
{{- end }}
