{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetiq-api
  labels:
    {{- include "synthetiq.labels" . | nindent 4 }}
    {{- include "synthetiq.selectorLabels" (dict "component" "api" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "synthetiq.selectorLabels" (dict "component" "api" "root" .) | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "synthetiq.prometheusAnnotations" (dict "path" .Values.api.telemetry.path "port" (.Values.api.telemetry.port | toString)) | nindent 8 }}
      labels:
        {{- include "synthetiq.selectorLabels" (dict "component" "api" "root" .) | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: api
          image: "{{ .Values.global.imageRegistry }}/api:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: synthetiq-config
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.api.env.TEMPORAL_ADDRESS | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.api.env.CORS_ORIGINS | quote }}
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: synthetiq-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: synthetiq-secrets
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: synthetiq-secrets
                  key: GEMINI_API_KEY
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/gcp/key.json
          volumeMounts:
            - name: gcp-sa-key
              mountPath: /etc/gcp
              readOnly: true
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: gcp-sa-key
          secret:
            secretName: synthetiq-gcp-key
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: synthetiq-api
  labels:
    {{- include "synthetiq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "synthetiq.selectorLabels" (dict "component" "api" "root" .) | nindent 4 }}
{{- end }}
