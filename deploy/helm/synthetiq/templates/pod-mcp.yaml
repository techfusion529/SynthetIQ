{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetiq-mcp
  labels:
    {{- include "synthetiq.labels" . | nindent 4 }}
    {{- include "synthetiq.selectorLabels" (dict "component" "mcp" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "synthetiq.selectorLabels" (dict "component" "mcp" "root" .) | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "synthetiq.prometheusAnnotations" (dict "path" .Values.mcp.telemetry.path "port" (.Values.mcp.telemetry.port | toString)) | nindent 8 }}
      labels:
        {{- include "synthetiq.selectorLabels" (dict "component" "mcp" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: mcp
          image: "{{ .Values.global.imageRegistry }}/mcp:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.mcp.port }}
              name: http
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: {{ .Values.mcp.env.OLLAMA_HOST | quote }}
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: synthetiq-mcp
  labels:
    {{- include "synthetiq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mcp.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "synthetiq.selectorLabels" (dict "component" "mcp" "root" .) | nindent 4 }}
{{- end }}
