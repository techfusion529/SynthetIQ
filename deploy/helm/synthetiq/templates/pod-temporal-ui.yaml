{{- if .Values.temporalUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  labels:
    {{- include "synthetiq.labels" . | nindent 4 }}
    {{- include "synthetiq.selectorLabels" (dict "component" "temporal-ui" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.temporalUi.replicaCount }}
  selector:
    matchLabels:
      {{- include "synthetiq.selectorLabels" (dict "component" "temporal-ui" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synthetiq.selectorLabels" (dict "component" "temporal-ui" "root" .) | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: temporal-ui
          image: "{{ .Values.temporalUi.image.repository }}:{{ .Values.temporalUi.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.temporalUi.port }}
              name: http
              protocol: TCP
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporalUi.env.TEMPORAL_ADDRESS | quote }}
          resources:
            {{- toYaml .Values.temporalUi.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  labels:
    {{- include "synthetiq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.temporalUi.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "synthetiq.selectorLabels" (dict "component" "temporal-ui" "root" .) | nindent 4 }}
{{- end }}
