{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetiq-worker
  labels:
    {{- include "synthetiq.labels" . | nindent 4 }}
    {{- include "synthetiq.selectorLabels" (dict "component" "worker" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "synthetiq.selectorLabels" (dict "component" "worker" "root" .) | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "synthetiq.prometheusAnnotations" (dict "path" .Values.worker.telemetry.path "port" (.Values.worker.telemetry.port | toString)) | nindent 8 }}
      labels:
        {{- include "synthetiq.selectorLabels" (dict "component" "worker" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.global.imageRegistry }}/worker:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.worker.telemetry.port }}
              name: metrics
              protocol: TCP
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.worker.env.TEMPORAL_ADDRESS | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.worker.env.TEMPORAL_TASK_QUEUE | quote }}
            - name: MCP_SERVER_URL
              value: {{ .Values.worker.env.MCP_SERVER_URL | quote }}
            - name: OLLAMA_HOST
              value: {{ .Values.worker.env.OLLAMA_HOST | quote }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: synthetiq-secrets
                  key: GEMINI_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: synthetiq-secrets
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: synthetiq-worker
  labels:
    {{- include "synthetiq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.worker.telemetry.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "synthetiq.selectorLabels" (dict "component" "worker" "root" .) | nindent 4 }}
{{- end }}
