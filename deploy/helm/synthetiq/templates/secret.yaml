apiVersion: v1
kind: Secret
metadata:
  name: synthetiq-secrets
  labels:
    {{- include "synthetiq.labels" . | nindent 4 }}
type: Opaque
stringData:
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | default "" | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default "postgresql+asyncpg://synthetiq:synthetiq@synthetiq-postgres:5432/synthetiq" | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "synthetiq-dev-jwt-secret-key" | quote }}
