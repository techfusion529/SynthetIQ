# ============================================================
# SynthetIQ Helm Values — Production GKE Overrides
# Optimized for 2-node GKE standard cluster (e2-standard-2)
# ============================================================

global:
  environment: prod
  imageRegistry: asia-south1-docker.pkg.dev/synthetiq-dev/synthetiq-docker-repo
  imagePullPolicy: Always

secrets:
  databaseUrl: "sqlite+aiosqlite:////tmp/synthetiq.db"

dashboard:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    CORS_ORIGINS: "*"

worker:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

mcp:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

simulator:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Non-essential external components (disabled on raw GKE)
ollama:
  enabled: false

temporalServer:
  enabled: false

temporalUi:
  enabled: false

grafana:
  enabled: false

prometheus:
  enabled: false

ingress:
  enabled: false
