# ============================================================
# SynthetIQ Helm Values — Production GKE Overrides
# Optimized for 2-node GKE standard cluster (e2-standard-2)
# ============================================================

global:
  environment: prod
  imageRegistry: asia-south1-docker.pkg.dev/synthetiq-dev/synthetiq-docker-repo
  imagePullPolicy: Always

secrets:
  geminiApiKey: ""
  databaseUrl: "postgresql+asyncpg://synthetiq:synthetiq@synthetiq-postgres:5432/synthetiq"
  jwtSecret: "synthetiq-dev-jwt-secret-key"

# ---- Application Variables Configuration ----
config:
  gcpProjectId: "synthetiq-dev"
  gcpRegion: "asia-south1"
  geminiModel: "gemini-3.8-flash"
  bigqueryDatasetId: "epr_compliance"
  bigquerySalesTable: "sales_data"
  bigqueryLocation: "asia-south1"
  pubsubScadaTopic: "scada-telemetry-stream"
  pubsubScadaSubscription: "scada-telemetry-sub"
  jevMode: "NIMBLE_PRIMARY"

# ---- Application Database ----
postgres:
  enabled: true
  replicaCount: 1

# ---- Redis Cache ----
redis:
  enabled: true
  replicaCount: 1

# ---- Temporal Server (Workflow Engine) ----
temporalServer:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---- Temporal Web UI ----
temporalUi:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ---- Executive Dashboard ----
dashboard:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---- API Gateway ----
api:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    TEMPORAL_ADDRESS: "temporal-server:7233"
    CORS_ORIGINS: "*"

# ---- AI Temporal Worker ----
worker:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    TEMPORAL_ADDRESS: "temporal-server:7233"
    TEMPORAL_TASK_QUEUE: "synthetiq-main"
    MCP_SERVER_URL: "http://synthetiq-mcp:8001"
    OLLAMA_HOST: "http://ollama:11434"

# ---- MCP Tool Gateway ----
mcp:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---- SCADA Simulator ----
simulator:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ---- Monitoring & Dashboards ----
grafana:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Ollama local models disabled in prod (uses Gemini via API)
ollama:
  enabled: false

ingress:
  enabled: true
  className: nginx
