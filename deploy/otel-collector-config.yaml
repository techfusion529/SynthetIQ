# ============================================================
# SynthetIQ OpenTelemetry Collector Configuration
# Receives OTLP (gRPC 4317, HTTP 4318) from Pods and Services,
# forwards metrics to Prometheus, and outputs debug traces/metrics.
# ============================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: ["*"]

processors:
  batch:
    timeout: 1s
    send_batch_size: 256
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: "synthetiq"
    send_timestamps: true
    metric_expiration: 180s
    enable_open_metrics: true
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
