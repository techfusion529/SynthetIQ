# Prometheus local dev scrape configuration
# Used by docker-compose.yml for local development

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "synthetiq-api"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: "/metrics"

  - job_name: "synthetiq-worker"
    static_configs:
      - targets: ["host.docker.internal:9090"]
    metrics_path: "/metrics"

  - job_name: "synthetiq-simulator"
    static_configs:
      - targets: ["host.docker.internal:9091"]
    metrics_path: "/metrics"

  - job_name: "synthetiq-dashboard"
    static_configs:
      - targets: ["host.docker.internal:3000"]
    metrics_path: "/api/metrics"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
