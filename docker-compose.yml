# ============================================================
# SynthetIQ — Full Local Development Stack
# Usage: docker compose up -d
# ============================================================

services:
  # --- Core Application Services ---
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: synthetiq-api
    ports:
      - "8000:8000"
    environment:
      - TEMPORAL_HOST=temporal-server:7233
      - AUTH_DEV_MODE=true
      - MCP_URL=http://mcp:8001
      - SIMULATOR_URL=http://simulator:9091
      - MOCKS_URL=http://mocks:8002
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JEV_MODE=${JEV_MODE:-NIMBLE_PRIMARY}
      - DATABASE_URL=postgresql+asyncpg://synthetiq:synthetiq@app-db:5432/synthetiq
      - REDIS_URL=redis://redis:6379/0
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-synthetiq-dev}
      - GCP_REGION=${GCP_REGION:-asia-south1}
      - BIGQUERY_DATASET_ID=${BIGQUERY_DATASET_ID:-epr_compliance}
      - BIGQUERY_SALES_TABLE=${BIGQUERY_SALES_TABLE:-sales_data}
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp/application_default_credentials.json
    volumes:
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro
    depends_on:
      - temporal-server
      - mcp
      - simulator
      - mocks
      - app-db
      - redis

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: synthetiq-worker
    ports:
      - "9092:9090"
    environment:
      - TEMPORAL_HOST=temporal-server:7233
      - MCP_URL=http://mcp:8001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - JEV_MODE=${JEV_MODE:-NIMBLE_PRIMARY}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_ENABLE_PII_SCRUBBING=${OLLAMA_ENABLE_PII_SCRUBBING:-false}
      - DATABASE_URL=postgresql+asyncpg://synthetiq:synthetiq@app-db:5432/synthetiq
      - REDIS_URL=redis://redis:6379/0
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-synthetiq-dev}
      - GCP_REGION=${GCP_REGION:-asia-south1}
      - BIGQUERY_DATASET_ID=${BIGQUERY_DATASET_ID:-epr_compliance}
      - PUBSUB_SCADA_TOPIC=${PUBSUB_SCADA_TOPIC:-scada-telemetry-stream}
      - PUBSUB_SCADA_SUBSCRIPTION=${PUBSUB_SCADA_SUBSCRIPTION:-scada-telemetry-sub}
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp/application_default_credentials.json
    volumes:
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro
    depends_on:
      - temporal-server
      - mcp
      - app-db
      - redis

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    container_name: synthetiq-mcp
    ports:
      - "8001:8001"
    environment:
      - DEV_MODE=true
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-synthetiq-dev}
      - GCP_REGION=${GCP_REGION:-asia-south1}
      - BIGQUERY_DATASET_ID=${BIGQUERY_DATASET_ID:-epr_compliance}
      - BIGQUERY_SALES_TABLE=${BIGQUERY_SALES_TABLE:-sales_data}
      - PUBSUB_SCADA_TOPIC=${PUBSUB_SCADA_TOPIC:-scada-telemetry-stream}
      - PUBSUB_SCADA_SUBSCRIPTION=${PUBSUB_SCADA_SUBSCRIPTION:-scada-telemetry-sub}
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp/application_default_credentials.json
    volumes:
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    container_name: synthetiq-simulator
    ports:
      - "9091:9091"

  mocks:
    build:
      context: .
      dockerfile: mocks/Dockerfile
    container_name: synthetiq-mocks
    ports:
      - "8002:8002"

  # --- Application State DB (multi-tenant orgs / schedules / workflow runs) ---
  app-db:
    image: postgres:15-alpine
    container_name: synthetiq-app-db
    environment:
      - POSTGRES_DB=synthetiq
      - POSTGRES_USER=synthetiq
      - POSTGRES_PASSWORD=synthetiq
    ports:
      - "5433:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthetiq -d synthetiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis (agent memory, session cache, cost-tracking counters) ---
  redis:
    image: redis:7-alpine
    container_name: synthetiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Ollama (Gemma 2B PII scrubbing + Nimble System 1 fraud detection) ---
  ollama:
    image: ollama/ollama:latest
    container_name: synthetiq-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Pull gemma2:2b on startup (PII scrubbing).
    # nimble requires a newer Ollama — pull it manually once the image updates:
    #   docker exec synthetiq-ollama ollama pull nimble
    entrypoint: ["/bin/bash", "-c",
      "ollama serve & sleep 8 && ollama pull gemma2:2b && wait"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # --- PostgreSQL for Temporal Engine ---
  temporal-db:
    image: postgres:15-alpine
    container_name: synthetiq-temporal-db
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    ports:
      - "5432:5432"
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Temporal Workflow Engine ---
  temporal-server:
    image: temporalio/auto-setup:latest
    container_name: synthetiq-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    depends_on:
      temporal-db:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    container_name: synthetiq-temporal-ui
    depends_on:
      - temporal-server
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000

  # --- Executive Dashboard Frontend ---
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: synthetiq-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  app-db-data:
  redis-data:
  ollama-data:
  temporal-db-data:
