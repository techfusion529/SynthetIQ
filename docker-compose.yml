# Usage: docker compose up -d
# ============================================================

services:
  # --- Core Application Services ---
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: synthetiq-api
    ports:
      - "8000:8000"
    environment:
      - TEMPORAL_HOST=temporal-server:7233
      - AUTH_DEV_MODE=true
      - MCP_URL=http://mcp:8001
      - SIMULATOR_URL=http://simulator:9091
      - MOCKS_URL=http://mocks:8002
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JEV_MODE=${JEV_MODE:-NIMBLE_PRIMARY}
    depends_on:
      - temporal-server
      - mcp
      - simulator
      - mocks

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: synthetiq-worker
    ports:
      - "9092:9090"
    environment:
      - TEMPORAL_HOST=temporal-server:7233
      - MCP_URL=http://mcp:8001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - JEV_MODE=${JEV_MODE:-NIMBLE_PRIMARY}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_ENABLE_PII_SCRUBBING=${OLLAMA_ENABLE_PII_SCRUBBING:-false}
    depends_on:
      - temporal-server
      - mcp

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    container_name: synthetiq-mcp
    ports:
      - "8001:8001"
    environment:
      - DEV_MODE=true

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    container_name: synthetiq-simulator
    ports:
      - "9091:9091"

  mocks:
    build:
      context: .
      dockerfile: mocks/Dockerfile
    container_name: synthetiq-mocks
    ports:
      - "8002:8002"

  # --- PostgreSQL Database for Temporal Engine ---
  temporal-db:
    image: postgres:15-alpine
    container_name: synthetiq-temporal-db
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    ports:
      - "5432:5432"

  # --- Temporal Workflow Engine ---
  temporal-server:
    image: temporalio/auto-setup:latest
    container_name: synthetiq-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    depends_on:
      - temporal-db

  temporal-ui:
    image: temporalio/ui:latest
    container_name: synthetiq-temporal-ui
    depends_on:
      - temporal-server
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000

  # --- Executive Dashboard Frontend ---
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: synthetiq-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
