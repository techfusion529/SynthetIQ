[project]
name = "synthetiq-mcp"
version = "0.1.0"
description = "SynthetIQ MCP Server — zero-trust tool execution gateway for agents"
requires-python = ">=3.13"
dependencies = [
    "synthetiq-shared",
    "mcp[cli]>=2.0.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-pubsub>=2.23.0",
    "google-auth>=2.35.0",
    "ollama>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "cryptography>=43.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
