[project]
name = "synthetiq-mcp"
version = "0.1.0"
description = "SynthetIQ MCP Server — zero-trust tool execution gateway for agents"
requires-python = ">=3.13"
dependencies = [
    "synthetiq-shared",
    "mcp[cli]>=2.0.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-pubsub>=2.21.0",
    "ollama>=0.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
