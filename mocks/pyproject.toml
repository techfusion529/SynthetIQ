[project]
name = "synthetiq-mocks"
version = "0.1.0"
description = "SynthetIQ Mocks — simulated ERP, CPCB portal, and DSC endpoints"
requires-python = ">=3.13"
dependencies = [
    "synthetiq-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
