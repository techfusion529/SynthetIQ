[project]
name = "synthetiq-mocks"
version = "0.1.0"
description = "SynthetIQ Mocks — Realistic simulated ERP, CPCB Portal, and DSC systems"
requires-python = ">=3.11"
dependencies = [
    "synthetiq-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=43.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
