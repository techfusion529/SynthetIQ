[project]
name = "synthetiq-shared"
version = "0.2.0"
description = "Shared config, async database engine, and multi-tenant ORM models for SynthetIQ"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
