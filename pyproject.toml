[project]
name = "synthetiq"
version = "0.1.0"
description = "Autonomous EPR Compliance & Anti-Fraud Engine — zero-trust multi-agent platform for India's plastic waste recycling ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "TechFusion", email = "techfusion529@gmail.com" },
]

dependencies = [
    # --- Orchestration ---
    "temporalio>=1.7.0",

    # --- Google Cloud ---
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-pubsub>=2.21.0",
    "google-generativeai>=0.8.0",
    "firebase-admin>=6.5.0",

    # --- MCP (Model Context Protocol) ---
    "mcp[cli]>=2.0.0",

    # --- API Gateway ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",

    # --- Domain & Config ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # --- AI & Privacy ---
    "ollama>=0.3.0",

    # --- Crypto (Mock DSC) ---
    "cryptography>=43.0.0",

    # --- Simulation & Data ---
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "faker>=28.0.0",

    # --- Observability ---
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetiq"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
