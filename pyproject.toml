[project]
name = "synthetiq"
version = "0.1.0"
description = "SynthetIQ — Autonomous EPR Compliance & Anti-Fraud Engine"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "TechFusion", email = "techfusion529@gmail.com" }]
dependencies = []

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "api",
    "worker",
    "mcp",
    "simulator",
    "mocks",
]

[tool.uv.sources]
synthetiq-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
