[project]
name = "synthetiq-simulator"
version = "0.1.0"
description = "SynthetIQ Simulator — Kaggle-grounded SCADA telemetry and corporate data generator"
requires-python = ">=3.11"
dependencies = [
    "synthetiq-shared",
    "google-cloud-pubsub>=2.21.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "faker>=28.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
