<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Top Ribbon: Bright Google Sky to Core Blue -->
    <linearGradient id="ribbonTop" x1="25" y1="15" x2="95" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Right Ribbon: Core Google Blue to Royal Cobalt -->
    <linearGradient id="ribbonRight" x1="100" y1="45" x2="55" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Left Ribbon: Deep Cobalt to Bright Sky Blue -->
    <linearGradient id="ribbonLeft" x1="50" y1="100" x2="20" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- AI Core Star Gradient -->
    <linearGradient id="aiCore" x1="40" y1="40" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- SEGMENT 1: TOP RECYCLING ARC & ARROW -->
  <path d="M30 50 L50 18 C54.5 11 65.5 11 70 18 L84 40" stroke="url(#ribbonTop)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M72 39 L85 42 L87 29" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- SEGMENT 2: BOTTOM-RIGHT RECYCLING ARC & ARROW -->
  <path d="M92 54 L103 72 C107.5 79.5 102 89 93 89 H66" stroke="url(#ribbonRight)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M74 80 L64 89 L74 98" stroke="#1D4ED8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- SEGMENT 3: BOTTOM-LEFT RECYCLING ARC & ARROW -->
  <path d="M48 89 H27 C18 89 12.5 79.5 17 72 L25 59" stroke="url(#ribbonLeft)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M15 64 L26 57 L31 69" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- CENTERPIECE: GOOGLE AI SPARKLE -->
  <path d="M60 35 C60 53 60 53 78 53 C60 53 60 53 60 71 C60 53 60 53 42 53 C60 53 60 53 60 35 Z" transform="translate(0, 6)" fill="url(#aiCore)" />

  <!-- Secondary AI Micro-Star -->
  <path d="M76 34 C76 39.5 76 39.5 81.5 39.5 C76 39.5 76 39.5 76 45 C76 39.5 76 39.5 70.5 39.5 C76 39.5 76 39.5 76 34 Z" fill="#38BDF8" />
</svg>