[project]
name = "synthetiq-worker"
version = "0.1.0"
description = "SynthetIQ Temporal Worker — 4 workflows, 8 AI agent activities, Saga orchestrator"
requires-python = ">=3.11"
dependencies = [
    "synthetiq-shared",
    "temporalio>=1.7.0",
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
