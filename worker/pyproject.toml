[project]
name = "synthetiq-worker"
version = "0.1.0"
description = "SynthetIQ Temporal Worker — Multi-agent AI orchestration with Gemini & real integrations"
requires-python = ">=3.13"
dependencies = [
    "synthetiq-shared",
    # Core orchestration
    "temporalio>=1.7.0",
    # Google AI & Cloud
    "google-adk>=1.0.0",
    "google-generativeai>=0.8.3",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-pubsub>=2.23.0",
    "google-auth>=2.35.0",
    # Multi-agent frameworks
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "langchain-google-genai>=2.0.5",
    # ML & Data
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
    # HTTP & APIs
    "httpx>=0.27.0",
    "requests>=2.32.0",
    # Observability
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "prometheus-client>=0.21.0",
    # State & Memory
    "redis>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Utilities
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
